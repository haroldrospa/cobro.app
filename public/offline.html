<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Offline | Cobro POS</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0B0F19;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Lights */
        .glowing-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .light-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            animation: float 10s infinite alternate ease-in-out;
        }

        .orb-primary {
            background: #10B981; /* Emerald */
            width: 300px;
            height: 300px;
            top: -50px;
            left: -50px;
        }

        .orb-secondary {
            background: #3B82F6; /* Blue */
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 48px 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand Logo styling */
        .brand-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Signal waves animations */
        .offline-icon-container {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-icon {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #F59E0B; /* Amber */
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.1);
        }

        .pulse-wave {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1px solid rgba(245, 158, 11, 0.2);
            animation: pulse 2s infinite ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .pulse-wave-2 {
            animation-delay: 1s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .offline-tag {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.2);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 4px 12px;
            border-radius: 100px;
            display: inline-block;
            margin-bottom: 20px;
        }

        p {
            font-size: 14px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .highlight-box {
            background: rgba(16, 185, 129, 0.05);
            border: 1px dashed rgba(16, 185, 129, 0.20);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 32px;
            font-size: 13px;
            color: #34D399;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Buttons styling */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: #10B981;
            color: #FFFFFF;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -3px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #E2E8F0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        /* Spin icon animation */
        .btn-primary.loading svg {
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="glowing-bg">
        <div class="light-orb orb-primary"></div>
        <div class="light-orb orb-secondary"></div>
    </div>

    <div class="card">
        <!-- Logo -->
        <div class="brand-logo">
            <img src="/cobro-logo.png" alt="Cobro POS Logo" onerror="this.src='/icon-192.png'">
        </div>

        <!-- Offline Icon Waves -->
        <div class="offline-icon-container">
            <div class="pulse-wave"></div>
            <div class="pulse-wave pulse-wave-2"></div>
            <div class="offline-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M8.53 16a6.9 6.9 0 0 1 3.47-1M12 20h.01"/>
                </svg>
            </div>
        </div>

        <div class="offline-tag">Modo Offline Activo</div>

        <h1>Sin conexión a Internet</h1>
        
        <p>Parece que no tienes conexión a la red en este momento. Verifica tu Wi-Fi o datos móviles.</p>

        <!-- PWA Feature highlight -->
        <div class="highlight-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
            <span>Puedes seguir vendiendo y facturando</span>
        </div>

        <!-- Buttons -->
        <button id="retry-btn" class="btn btn-primary" onclick="retryConnection()">
            <svg id="retry-icon" class="mr-2" style="margin-right: 8px; display: inline-block; vertical-align: middle;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            <span>Reintentar Conexión</span>
        </button>

        <a href="/" class="btn btn-secondary">
            Seguir trabajando
        </a>
    </div>

    <script>
        function retryConnection() {
            const btn = document.getElementById('retry-btn');
            btn.classList.add('loading');
            
            // Simular un pequeño retardo de red para dar feedback visual
            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    btn.classList.remove('loading');
                    // Mostrar una alerta nativa amigable
                    alert('Sigues sin conexión a internet. Reintenta en unos instantes.');
                }
            }, 1000);
        }

        // Si la conexión vuelve sola, recargar la página inmediatamente
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
