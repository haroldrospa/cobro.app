<body>
  <div id="root">
    <style>
      .app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1a2228 0%, #121619 100%);
        color: white;
        z-index: 99999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-preloader-text {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .app-preloader-text span {
        color: #10b981;
      }
      .preloader-bar-container {
        width: 128px;
        height: 4px;
        background-color: rgba(16, 185, 129, 0.15);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-top: 12px;
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background-color: #10b981;
        border-radius: 9999px;
        animation: preloader-slide 1.5s infinite ease-in-out;
      }
      @keyframes preloader-slide {
        0% { left: -50%; width: 30%; }
        50% { left: 30%; width: 40%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
    <div class="app-preloader">
      <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;">
        <img src="/logo-dark.png" alt="Cobroapp Logo" style="height: 56px; width: auto; border-radius: 12px;" />
        <div class="app-preloader-text">Cobro<span>app</span></div>
      </div>
      <div class="preloader-bar-container">
        <div class="preloader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
